# Defines that this is a Deployment resource
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend                 # Name of the Deployment
  namespace: nimc-demo          # Namespace where the deployment will run
  labels:
    app: backend                # Label for identifying the application
    tier: api                   # Label grouping by tier
spec:
  replicas: 2                   # Number of pod replicas to maintain
  selector:
    matchLabels:
      app: backend              # Pods must match this label to be managed by this Deployment
  template:
    metadata:
      labels:
        app: backend            # Labels applied to the Pod template
        tier: api
    spec:
      containers:
      - name: backend           # Name of the container
        image: successtech/bcb8:v1   # Image to deploy
        ports:
        - containerPort: 3000   # Port the application inside the container listens on

        # Environment variables coming from a Kubernetes Secret
        env:
        - name: WEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: nimc-api-keys            # Name of the secret
              key: weather-api-key           # Key to read inside the secret
        - name: PAYMENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: nimc-api-keys
              key: payment-api-key
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: nimc-api-keys
              key: encryption-key
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nimc-api-keys
              key: smtp-password

        # Environment variables coming from a ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: nimc-config               # Name of the configmap
              key: environment                # Key inside the configmap
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: nimc-config
              key: app-name
        - name: SUPPORT_EMAIL
          valueFrom:
            configMapKeyRef:
              name: nimc-config
              key: support-email

        # Hardcoded environment variable
        - name: NODE_ENV
          value: "production"

        # Resource requests and limits to control CPU & memory usage
        resources:
          requests:
            memory: "128Mi"      # Minimum memory required
            cpu: "100m"          # Minimum CPU required
          limits:
            memory: "256Mi"      # Maximum allowed memory usage
            cpu: "200m"          # Maximum allowed CPU usage

---
# Service exposes the backend pods inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: backend-service         # Name of the Service
  namespace: nimc-demo
spec:
  selector:
    app: backend                # The service routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 3000                # Port exposed within the cluster
      targetPort: 3000          # Port the container listens on
